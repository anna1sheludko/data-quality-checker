[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-checker"
version = "1.0.0"
description = "Analyze CSV/Excel files and generate a data quality report"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anna Sheludko", email = "annasheludko152@gmail.com" }
]
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.4.0",
    "openpyxl>=3.1.2",
    "pyyaml==6.0.1",
    "jinja2>=3.1.3",
    "rich>=13.7.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
]

[project.scripts]
dqc = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"